name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Skips cleanly until the architect sets up the project (no package.json yet).
      - name: Detect project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — skipping checks."
          fi

      - name: Set up Node
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'   # architect may change this; keep in sync with .nvmrc

      - name: Install
        if: steps.detect.outputs.ready == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        if: steps.detect.outputs.ready == 'true'
        run: npm run lint --if-present

      - name: Type-check
        if: steps.detect.outputs.ready == 'true'
        run: npm run typecheck --if-present

      - name: Test
        if: steps.detect.outputs.ready == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.detect.outputs.ready == 'true'
        run: npm run build --if-present

      - name: Block committed env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::An .env file is committed. Remove it and rotate any secrets it contained."
            exit 1
          fi
